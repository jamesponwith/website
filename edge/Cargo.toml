[package]
name = "phux-edge"
description = "A phux server that runs as WASM in a Cloudflare Durable Object: speaks the real phux wire to the browser client, backed by a curated demo shell (no OS processes — free, no Containers)."
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/no-phux/website"
publish = false

# Standalone workspace (wasm-only); the site tree has no cargo workspace of
# its own, and this crate is excluded from the root one.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned phux commit. The committed worker/edge wasm is what deploys; rebuild
# with scripts/build-edge.sh after moving this rev. Default features are
# wasm-safe (ADR-0024).
phux-protocol = { git = "https://github.com/no-phux/phux", rev = "7eaa9cf61909e41d36ef2afa776444b9fde06e7f" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
