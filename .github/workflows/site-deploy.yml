name: site-deploy

# Build the Astro site and deploy it as a Workers static-assets worker
# (phux-site) on phux.sh and docs.phux.sh. Docs, installers, and product skills
# stay in no-phux/phux. This workflow checks that repo out and sync-docs copies
# them in. phux tells this repo to rebuild via repository_dispatch (event type
# phux-content) when those inputs change, including a published release. The
# Monday cron is the backstop.
# The live demo reads PUBLIC_PHUX_DEMO_WS (a repo *variable*); it points at the
# Worker's wss URL (see site-deploy-worker.yml + DEPLOY.md).

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [phux-content]
  # Weekly backstop so the badge and published docs cannot drift forever.
  schedule:
    - cron: "7 13 * * 1"
  workflow_dispatch:

concurrency:
  # Match the Worker deploy lane: never cancel mid-wrangler / mid-verify.
  # Queuing is cheap (Astro build p50 ~1m) and a half-applied deploy is not.
  group: mini-v1-site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHUX_ROOT: ${{ github.workspace }}/phux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: no-phux/phux
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: phux
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # sync-docs reads $PHUX_ROOT/docs and stamps source links with that checkout.
      - name: Sync docs into the site
        run: bun run sync-docs

      - name: Build
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_PHUX_DEMO_WS: ${{ vars.PUBLIC_PHUX_DEMO_WS }}

      - name: Check built links
        run: bun run check:links

      # infra/alchemy.run.ts declares the Worker. CI starts from empty state
      # and Alchemy re-adopts the live Worker by its alchemy:* tags.
      - name: Install infra dependencies
        working-directory: infra
        run: bun install --frozen-lockfile

      - name: Deploy site worker (static assets)
        working-directory: infra
        run: bunx alchemy deploy --stage prod --yes --no-input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Exercise the custom domain and Worker-only member routes after deploy.
      # A successful asset upload does not prove either surface: in particular,
      # a newly required secret can leave /api/claim returning 503 while the
      # deployment itself remains green.
      - name: Verify the docs surface and member routes
        run: |
          set -euo pipefail
          deployed="${GITHUB_SHA}"

          redirect="$(curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w '%{redirect_url}' \
            "https://docs.phux.sh/?deployed=${deployed}")"
          if [ "$redirect" != "https://docs.phux.sh/overview?deployed=${deployed}" ]; then
            echo "docs.phux.sh root redirected to '${redirect}', not /overview" >&2
            exit 1
          fi

          overview="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            "https://docs.phux.sh/overview?deployed=${deployed}")"
          if ! grep -Fq 'rel="canonical" href="https://docs.phux.sh/overview"' <<<"$overview"; then
            echo "docs.phux.sh/overview did not return the canonical docs document" >&2
            exit 1
          fi
          stylesheet="${overview#*href=\"/_astro/}"
          stylesheet="/_astro/${stylesheet%%\"*}"
          case "$stylesheet" in
            /_astro/*.css) ;;
            *)
              echo "docs.phux.sh/overview did not reference its built stylesheet" >&2
              exit 1
              ;;
          esac
          css_type="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w '%{content_type}' "https://docs.phux.sh${stylesheet}")"
          case "$css_type" in
            text/css*) ;;
            *)
              echo "${stylesheet} returned content type '${css_type}', not CSS" >&2
              exit 1
              ;;
          esac

          claim_status="$(curl -sS --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w '%{http_code}' \
            "https://docs.phux.sh/api/claim?t=invalid&deployed=${deployed}")"
          if [ "$claim_status" != 400 ]; then
            echo "member claim route returned ${claim_status}; expected configured token validation (400)" >&2
            exit 1
          fi
          join_status="$(curl -sS --retry 6 --retry-delay 5 --retry-all-errors \
            -X POST -H 'content-type: application/json' --data '{}' \
            -o /dev/null -w '%{http_code}' \
            "https://docs.phux.sh/api/join?deployed=${deployed}")"
          if [ "$join_status" != 400 ]; then
            echo "member join route returned ${join_status}; expected configured validation (400)" >&2
            exit 1
          fi
          echo "docs surface and member routes verified"

      # The curl installers are the assets whose ROUTES cannot be proven before
      # a deploy: `infra/alchemy.run.ts` sets html_handling, and an extensionless
      # asset is an unusual shape for it to resolve. Everything else about the
      # scripts is gated in `just ci` (scripts/check-install-surface.sh), so this
      # step only answers "does the URL people are told to pipe to sh actually
      # return the script". Failing here is loud and costs nobody an install;
      # finding out from a stranger's broken terminal is the alternative.
      # The commit SHA busts any edge cache left over from the previous deploy.
      - name: Verify the installers are served
        run: |
          set -euo pipefail
          for path in install install.sh; do
            url="https://phux.sh/${path}?deployed=${GITHUB_SHA}"
            served="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$url")"
            # Take the shebang by parameter expansion, not `| head -n 1`: under
            # `pipefail` a closing reader turns into a SIGPIPE failure and the
            # step flakes on a deploy that was perfectly fine.
            shebang="${served%%$'\n'*}"
            if [ "$shebang" != '#!/bin/sh' ]; then
              echo "https://phux.sh/${path} did not return a POSIX sh script" >&2
              echo "first line was: ${shebang}" >&2
              exit 1
            fi
            if ! grep -Fq 'no-phux/phux/releases/download' <<<"$served"; then
              echo "https://phux.sh/${path} is missing its release download URL" >&2
              exit 1
            fi
          done
          echo "installer verified at /install and /install.sh"
          for path in install-cockpit install-cockpit.sh; do
            url="https://phux.sh/${path}?deployed=${GITHUB_SHA}"
            served="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$url")"
            shebang="${served%%$'\n'*}"
            if [ "$shebang" != '#!/bin/sh' ]; then
              echo "https://phux.sh/${path} did not return a POSIX sh script" >&2
              echo "first line was: ${shebang}" >&2
              exit 1
            fi
            if ! grep -Fq 'phux-cockpit-' <<<"$served"; then
              echo "https://phux.sh/${path} is missing its Cockpit asset name" >&2
              exit 1
            fi
          done
          echo "cockpit installer verified at /install-cockpit and /install-cockpit.sh"
          for path in install-desktop install-desktop.sh; do
            downloaded="$(mktemp)"
            curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
              "https://phux.sh/${path}?deployed=${GITHUB_SHA}" -o "$downloaded"
            cmp phux/scripts/install-desktop.sh "$downloaded"
            rm "$downloaded"
          done
          echo "desktop installer verified byte-for-byte at /install-desktop and /install-desktop.sh"
