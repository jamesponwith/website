name: ci

# Pull-request and main checks for the site. Deploys stay in site-deploy.yml
# and site-deploy-worker.yml. Docs and installers are read from no-phux/phux.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHUX_ROOT: ${{ github.workspace }}/phux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: no-phux/phux
          ref: main
          path: phux
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish contract
        run: bash scripts/check-publish.sh

      - name: Native image pin
        run: python3 scripts/ci/site_source_pin.py --check

      - name: Native image pin tests
        run: python3 scripts/ci/test_site_source_pin.py

      - name: Test
        run: bun run test

      - name: Sync docs
        run: bun run sync-docs
